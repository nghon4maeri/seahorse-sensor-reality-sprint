[package]
name = "camera_guard_rs"
version = "0.1.0"
edition = "2021"
description = "High-performance real-time ADAS camera degradation health monitor and safety guard"
license = "MIT"

[lib]
name = "camera_guard_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "guard_cli"
path = "src/bin/guard_cli.rs"

[features]
default = []
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
numpy = { version = "0.23", optional = true }
pyo3 = { version = "0.23", optional = true }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "metrics_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
